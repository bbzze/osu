name: Build osu iOS (.net 11)
on: workflow_dispatch
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Point osu iOS at .NET 11
        run: |
          rm global.json
          sed -i '' 's/net10.0-ios/net11.0-ios/' osu.iOS/osu.iOS.csproj
      - name: Install iOS tools
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          dotnet workload install ios
      - name: Build
        run: >
          dotnet build osu.iOS -c Debug -r ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:_RequireCodeSigning=false
          -p:EnableAssemblyILStripping=false
      - name: Make the IPA
        run: |
          APP=$(find osu.iOS/bin -name "*.app" -maxdepth 6 | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r osu.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: osu-ios
          path: osu.ipa
