name: Build osu iOS (.net 11)
on: workflow_dispatch
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Point osu iOS at .NET 11
        run: |
          rm global.json
          sed -i '' 's/net10.0-ios/net11.0-ios/' osu.iOS/osu.iOS.csproj
      - name: Install iOS tools
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          dotnet workload install ios
      - name: Remove debug notes files
        run: |
          dotnet restore osu.iOS -r ios-arm64
          find ~/.nuget/packages ~/.dotnet/packs -name "*.pdb" -delete
      - name: Build
        run: >
          dotnet publish osu.iOS -c Release -f net11.0-ios -r ios-arm64
          --self-contained
          -p:Version=2026.1110.0
          -p:UseMonoRuntime=false
          -p:PublishReadyToRunStripDebugInfo=false
          -p:PublishReadyToRunStripInliningInfo=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:_RequireCodeSigning=false
      - name: Make the IPA
        run: |
          APP=$(find osu.iOS/bin -name "*.app" -maxdepth 6 | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r osu.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: osu-ios
          path: osu.ipa
