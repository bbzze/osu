name: Build osu iOS
on: workflow_dispatch
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install iOS tools
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          dotnet workload install ios --version 10.0.402
      - name: Build
        run: >
          dotnet build osu.iOS -c Debug -r ios-arm64
          -p:CodesignRequireProvisioningProfile=false
          -p:_RequireCodeSigning=false
          -p:EnableAssemblyILStripping=false
      - name: Make the IPA
        run: |
          APP=$(find osu.iOS/bin -name "*.app" -maxdepth 6 | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r osu.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: osu-ios
          path: osu.ipa
